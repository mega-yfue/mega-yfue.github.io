# Build the host-facing eufy SDK docs site and publish it at https://mega-yfue.github.io/
#
# This repo holds NO documentation content — only this workflow. The site is generated entirely from
# the SDK repo's docs folder on every run, so there is nothing here to keep in sync and no copy of
# the guides, the device imagery, or the generated API reference to drift out of date.
#
# What gets published: the docs guide folder ONLY. VitePress' srcDir is that folder, so the build
# cannot reach the SDK's `docs/` root, which holds internal reverse-engineering and crypto notes.
# The `guard:docs` step (folded into the SDK's `npm run build`) additionally re-sweeps the TypeDoc-
# generated API pages for wire/crypto/RE phrases that slipped into a public symbol's JSDoc, and
# fails the build on a hit. Both guards must stay in place.
#
# The SDK is public, so the checkout uses this repo's own GITHUB_TOKEN and there is no credential here
# to scope, rotate, or expire.
#
# The site base is left to the SDK's VitePress config, which defaults to `/` — a `<name>.github.io`
# site is served from the domain root, not from `/<repo>/`.
#
# ── Why there is no `pull_request` trigger ──────────────────────────────────────────────────────
# Every page comes from another repository, so a pull request here has no content to validate — and
# the job carries `pages: write`, which publishes the live site. Keep the triggers limited to the
# ones below.
#
# ── Actions are pinned to full-length commit SHAs ───────────────────────────────────────────────
# A tag is mutable: whoever owns the action can move `v7` onto different code, and this workflow
# would run it without a single character changing here. A SHA is immutable, so an update is a
# reviewable diff. The trailing `# vX.Y.Z` is the human-readable version and is what Dependabot
# rewrites alongside the SHA (see dependabot.yml — pinning trades automatic patch pickup for
# immutability, so that config is what keeps these fresh).
name: pages

on:
  push:
    branches: [main]
  # The SDK repo cannot notify this one without a cross-repo token, so the site refreshes nightly
  # and on demand. Use "Run workflow" for an immediate publish after an SDK change.
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

# Least privilege plus the tokens the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the SDK (source of the guides and the API reference)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mega-yfue/eufy-sdk
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.5.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # The API reference is generated from the SDK source, so TypeDoc has to resolve the library's
      # own imports and types. That needs the root dependency tree, not just the docs site's.
      - name: Install SDK dependencies (for TypeDoc source resolution)
        run: npm ci

      - name: Install docs site dependencies
        working-directory: docs
        run: npm ci

      # `npm run build` chains: docs:api (TypeDoc) → guard:docs (leak sweep) → vitepress build.
      - name: Build the docs site
        working-directory: docs
        run: npm run build

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
